<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Srikanth Learning App</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #0d6efd;
      --border-color: #dee2e6;
    }
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --primary-color: #375a7f;
      --border-color: #444444;
    }
    body {
      font-family: Arial, sans-serif.h;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }
    header {
      background: var(--primary-color);
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text-color);
    }
    button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      opacity: 0.9;
    }
    .mcq-preview-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 15px;
      margin-top: 15px;
      border-radius: 6px;
    }
    .mcq-preview-card h4 { margin-top: 0; }
    .optional-tag { color: #888; font-size: 0.85em; }
  </style>
</head>
<body>

  <header>
    <h1>Srikanth Learning App</h1>
    <button onclick="toggleDarkMode()" style="float: right; margin-top: -30px;">Toggle Theme</button>
  </header>

  <div class="container">
    <h2>Upload New MCQ</h2>
    <form id="mcqForm">
      <div class="form-group">
        <label>Question: *</label>
        <textarea id="qText" rows="2" placeholder="e.g. Which authority constitutes a National Tribunal?" required></textarea>
      </div>

      <div class="form-group">
        <label>Option A: *</label>
        <input type="text" id="optA" placeholder="State Government" required>
      </div>
      <div class="form-group">
        <label>Option B: *</label>
        <input type="text" id="optB" placeholder="Central Government" required>
      </div>
      <div class="form-group">
        <label>Option C: *</label>
        <input type="text" id="optC" placeholder="Labour Court" required>
      </div>
      <div class="form-group">
        <label>Option D: *</label>
        <input type="text" id="optD" placeholder="High Court" required>
      </div>

      <div class="form-group">
        <label>Correct Answer Letter (e.g., B): *</label>
        <input type="text" id="qAnswer" maxlength="1" placeholder="B" required>
      </div>

      <div class="form-group">
        <label>Explanation: *</label>
        <textarea id="qExplanation" rows="3" placeholder="Detailed explanation..." required></textarea>
      </div>

      <!-- Optional Fields -->
      <div class="form-group">
        <label>Trick <span class="optional-tag">(Optional - Leave blank if missing)</span>:</label>
        <input type="text" id="qTrick" placeholder="e.g. National = Central Government">
      </div>

      <div class="form-group">
        <label>Example <span class="optional-tag">(Optional - Leave blank if missing)</span>:</label>
        <textarea id="qExample" rows="2" placeholder="Real-world application scenario..."></textarea>
      </div>

      <div class="form-group">
        <label>Section / Reference <span class="optional-tag">(Optional - Leave blank if missing)</span>:</label>
        <input type="text" id="qSection" placeholder="e.g. Section 7B, Industrial Disputes Act, 1947">
      </div>

      <button type="submit">Save and Publish MCQ</button>
    </form>
  </div>

  <div class="container" id="displayContainer">
    <h2>Uploaded MCQs Database</h2>
    <div id="mcqList"></div>
  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    document.getElementById('mcqForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const newMCQ = {
        question: document.getElementById('qText').value.trim(),
        options: {
          A: document.getElementById('optA').value.trim(),
          B: document.getElementById('optB').value.trim(),
          C: document.getElementById('optC').value.trim(),
          D: document.getElementById('optD').value.trim()
        },
        answer: document.getElementById('qAnswer').value.trim().toUpperCase(),
        explanation: document.getElementById('qExplanation').value.trim(),
        trick: document.getElementById('qTrick').value.trim(),
        example: document.getElementById('qExample').value.trim(),
        section: document.getElementById('qSection').value.trim()
      };

      let mcqs = JSON.parse(localStorage.getItem('app_mcqs')) || [];
      mcqs.push(newMCQ);
      localStorage.setItem('app_mcqs', JSON.stringify(mcqs));

      alert('MCQ successfully added!');
      this.reset();
      loadMCQs();
    });

    function loadMCQs() {
      const listEl = document.getElementById('mcqList');
      let mcqs = JSON.parse(localStorage.getItem('app_mcqs')) || [];
      
      if (mcqs.length === 0) {
        listEl.innerHTML = '<p>No MCQs uploaded yet.</p>';
        return;
      }

      listEl.innerHTML = '';
      mcqs.forEach((item, index) => {
        let card = document.createElement('div');
        card.className = 'mcq-preview-card';
        
        card.innerHTML = `
          <h4>Q${index + 1}. ${item.question}</h4>
          <ul>
            <li>A. ${item.options.A}</li>
            <li>B. ${item.options.B}</li>
            <li>C. ${item.options.C}</li>
            <li>D. ${item.options.D}</li>
          </ul>
          <p><strong>Answer:</strong> ${item.answer}</p>
          <p><strong>Explanation:</strong> ${item.explanation}</p>
          ${item.trick ? `<p><strong>Trick:</strong> ${item.trick}</p>` : ''}
          ${item.example ? `<p><strong>Example:</strong> ${item.example}</p>` : ''}
          ${item.section ? `<p><strong>Section:</strong> ${item.section}</p>` : ''}
        `;
        listEl.appendChild(card);
      });
    }

    window.onload = loadMCQs;
  </script>
</body>
</html>
